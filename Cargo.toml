[package]
name = "yt_downloader"
version = "1.1.3"
edition = "2024"
build = "build.rs"

[dependencies]
iced = { version = "0.14.0", features = ["tokio", "image", "sipper", "advanced"] }
iced_aw = { version = "0.14.1", features = ["full"] }

windows = { version = "0.62.2", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_Globalization",
  "Win32_UI_Shell",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_System_StationsAndDesktops",
]}

serde = { version = "1.0.229", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
tokio = { version = "1.54.1", features = ["full"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zip = "9.0.5"
which = "8.0.6"
dirs = "7.0.0"
serde_json = "1.0.154"
futures-util = "0.3.34"
rfd = "0.17.2"
windows-registry = "0.6.1"
windows-result = "0.4.1"
url = { version = "2.5.8", features = ["serde"] }
lyon_algorithms = "1.0.22"
ordermap = "1.2.2"
tracing-appender = "0.2.5"

[build-dependencies]
winresource = "0.1.34"
